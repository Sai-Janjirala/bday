<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No zoom lock: pinning the scale blocks pinch-to-zoom, which is an
         accessibility failure on a page meant to be read slowly. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A birthday, made by hand. An evening of reasons, photographs, a wish, a letter, and one better-kept secret."
    />
    <meta name="theme-color" content="#241b22" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcf9f5" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Happy Birthday, Potti" />
    <meta
      property="og:description"
      content="A birthday, made by hand. An evening of reasons, photographs, a wish, a letter, and one better-kept secret."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cormorant Garamond for display, Inter for text, Dancing Script
         for the signature. `display=swap` so the page is readable
         immediately in the fallback serif. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Dancing+Script:wght@400;500&family=Inter:wght@300;400;500;600&display=swap"
    />

    <!-- A wax-seal monogram, drawn rather than an emoji. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23b0657c'/><circle cx='50' cy='50' r='38' fill='none' stroke='%23f4ede5' stroke-width='1.5' opacity='.55'/><text x='50' y='50' dy='.35em' text-anchor='middle' font-family='Georgia,serif' font-size='42' fill='%23fcf9f5'>P</text></svg>"
    />

    <title>Happy Birthday, Potti</title>

    <!-- The page opens on night, so paint it before the bundle lands. -->
    <style>
      html {
        background-color: #241b22;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="
          font-family: Georgia, 'Times New Roman', serif;
          color: #fcf9f5;
          background: #241b22;
          min-height: 100vh;
          display: grid;
          place-content: center;
          padding: 2rem;
          text-align: center;
        "
      >
        <h1 style="font-weight: 400; margin: 0 0 1rem">Happy Birthday</h1>
        <p style="margin: 0; opacity: 0.7; max-width: 34ch; line-height: 1.7">
          This one is built out of moving pictures, so it needs JavaScript
          turned on. The good part is still here.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
